[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=core --cov=routers --cov-report=term-missing"

[tool.coverage.run]
source = ["core", "routers"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 75
